name: Diamond Utility

on:
  push:
    paths:
      - 'diamond-utility/**'
      - '.github/workflows/diamond-utility.yml'
  pull_request:
    paths:
      - 'diamond-utility/**'
      - '.github/workflows/diamond-utility.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: diamond-utility
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: diamond-utility/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
