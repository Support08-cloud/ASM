name: Diamond Utility

on:
  push:
    paths:
      - 'diamond-utility/**'
      - '.github/workflows/diamond-utility.yml'
  pull_request:
    paths:
      - 'diamond-utility/**'
      - '.github/workflows/diamond-utility.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: diamond-utility
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: diamond-utility/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: diamond-utility
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: diamond-utility/package-lock.json
      - run: npm ci
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: DiamondUtility-win-x64
          path: diamond-utility/release/DiamondUtility.exe
          if-no-files-found: error
