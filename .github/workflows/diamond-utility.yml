name: Diamond Utility

on:
  push:
    paths:
      - 'diamond-utility/**'
      - '.github/workflows/diamond-utility.yml'
  pull_request:
    paths:
      - 'diamond-utility/**'
      - '.github/workflows/diamond-utility.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: diamond-utility
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: diamond-utility/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: diamond-utility
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: diamond-utility/package-lock.json
      - run: npm ci
      - name: Stage ffmpeg for the portable EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path extra-bin | Out-Null
          $dest = Join-Path $env:RUNNER_TEMP 'ffmpeg-gyan'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          gh release download 9.0.1 --repo GyanD/codexffmpeg --pattern 'ffmpeg-9.0.1-essentials_build.zip' --dir $dest
          $zip = Get-ChildItem $dest -Filter *.zip | Select-Object -First 1
          if (-not $zip) { throw 'ffmpeg zip not downloaded' }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath (Join-Path $dest 'extracted') -Force
          $exe = Get-ChildItem (Join-Path $dest 'extracted') -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { throw 'ffmpeg.exe not found in the Gyan build' }
          Copy-Item $exe.FullName extra-bin\ffmpeg.exe
          & extra-bin\ffmpeg.exe -hide_banner -version | Select-Object -First 1
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: DiamondUtility-win-x64
          path: diamond-utility/release/*.exe
          if-no-files-found: error
